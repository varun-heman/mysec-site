    <tspan x="80" y="316">One AI watching every</tspan>
    <tspan x="80" y="404">camera, gate and door.</tspan>
  </text>

  <!-- Sub -->
  <text x="80" y="474" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#8E8A87">
