# =============================================================================
# mySecurity — Netlify configuration
# Static site: nothing to build, the repository root is the publish directory.
# =============================================================================

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = false

[build.processing.html]
  pretty_urls = true      # /platform serves platform.html

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false          # ES modules — let the browser fetch them as authored
  minify = true

[build.processing.images]
  compress = true

# -----------------------------------------------------------------------------
# Security headers
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = """
      default-src 'self'; \
      script-src 'self'; \
      style-src 'self' https://fonts.googleapis.com; \
      font-src 'self' https://fonts.gstatic.com; \
      img-src 'self' data:; \
      connect-src 'self'; \
      form-action 'self'; \
      frame-ancestors 'none'; \
      base-uri 'self'; \
      object-src 'none'"""

# -----------------------------------------------------------------------------
# Caching
# Fingerprint asset filenames before turning these into immutable caches;
# until then a one-day cache keeps deploys visible without a hard refresh.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# -----------------------------------------------------------------------------
# Redirects — keep old/short paths working
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/demo"
  to = "/contact.html#demo"
  status = 301

[[redirects]]
  from = "/home"
  to = "/residential.html"
  status = 301

[[redirects]]
  from = "/business"
  to = "/commercial.html"
  status = 301

[[redirects]]
  from = "/security"
  to = "/privacy.html#security"
  status = 301
